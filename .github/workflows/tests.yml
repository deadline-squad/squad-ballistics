name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries for Qt
        # libxcb-cursor0 and the other libxcb-* libraries: Qt's xcb platform
        # (the X11 tests); xcompmgr: the overlay test with a compositor.
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1
          libasound2t64 libxshmfence1 libgbm1 libxi6
          libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          xvfb xdotool xcompmgr
      - name: Install dependencies
        # The pinned versions users install (requirements.txt), including
        # PyQt6-WebEngine, plus pytest and pyflakes.
        run: pip install -r requirements-dev.txt
      - name: Pyflakes
        # Only the two deliberate imports may be reported: QtWebEngine has to
        # be imported before QApplication is created.
        run: |
          pyflakes *.py tests > pyflakes.txt || true
          cat pyflakes.txt
          cat > pyflakes-expected.txt <<'EOF'
          app.py: 'PyQt6.QtWebEngineWidgets' imported but unused
          tests/conftest.py: 'PyQt6.QtWebEngineWidgets' imported but unused
          EOF
          sed -E 's/^([^:]+):[0-9]+:[0-9]+:? /\1: /' pyflakes.txt | sort > pyflakes-found.txt
          diff pyflakes-expected.txt pyflakes-found.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q -rs -p no:cacheprovider | tee pytest.txt
          test "${PIPESTATUS[0]}" -eq 0
      - name: No unexpected skips
        # Only the uinput tests may skip: GitHub's runners give no writable
        # /dev/uinput.
        run: |
          grep '^SKIPPED' pytest.txt || true
          grep '^SKIPPED' pytest.txt | sed -E 's/^SKIPPED \[[0-9]+\] ([^:]+):[0-9]+: /\1: /' | sort > skips-found.txt || true
          cat > skips-expected.txt <<'EOF'
          tests/test_keyinject.py: /dev/uinput is not writable
          tests/test_keystate.py: /dev/uinput is not writable
          EOF
          diff skips-expected.txt skips-found.txt
